name: Enhancement
description: Improve an existing feature, flow, or developer workflow
labels: [enhancement]
body:
  - type: textarea
    id: target
    attributes:
      label: What should be improved?
      description: Reference the current behavior or file/section.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this enhancement needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: List expected changes and non-goals.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked for existing issues or PRs covering this enhancement.
          required: true
